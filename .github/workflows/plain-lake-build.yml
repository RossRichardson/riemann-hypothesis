name: Full Lake build of the weight-zero period matrix change

on:
  push:
    branches: [verify-full-weight-zero-periods]
    paths: [.github/workflows/plain-lake-build.yml]

permissions:
  contents: read

jobs:
  build:
    if: github.repository == 'RossRichardson/riemann-hypothesis'
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    env:
      BASE_SHA: 6866a9c6260d77b88a7b5477433e3044b6844f9b
      CANDIDATE_SHA: 4d8a3b4cb4b653268eac38bdb35959710ce5cc37
      LEAN_NUM_THREADS: '1'
      LEAN_ABORT_ON_PANIC: '1'
    steps:
      - name: Prepare storage and memory on the disposable GitHub runner
        shell: bash
        run: |
          set -euo pipefail
          df -h "$GITHUB_WORKSPACE"
          free -h
          sudo rm -rf -- /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup
          sudo sysctl -w vm.max_map_count=1048576
          swapfile="$RUNNER_TEMP/lake.swap"
          sudo fallocate -l 24G "$swapfile"
          sudo chmod 600 "$swapfile"
          sudo mkswap "$swapfile"
          sudo swapon "$swapfile"
          free -h

          # Keep the toolchain, dependencies, and unpacked Lean files on a compressed volume.
          volume="$GITHUB_WORKSPACE/build-volume"
          mkdir -p "$volume"
          if ! command -v mkfs.btrfs >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends btrfs-progs
          fi
          image="$RUNNER_TEMP/lake.btrfs"
          free_mib=$(df -Pm "$RUNNER_TEMP" | awk 'END {print $4}')
          truncate -s "$((free_mib - 6144))M" "$image"
          sudo mkfs.btrfs -f -m single "$image"
          if sudo mount -o loop,compress-force=zstd:3,noatime "$image" "$volume"; then
            sudo chown "$(id -u):$(id -g)" "$volume"
          else
            echo "Compressed mount unavailable. Using the runner filesystem."
            rm -f -- "$image"
          fi
          mkdir -p "$volume/elan" "$volume/cache" "$volume/tmp"
          {
            echo "ELAN_HOME=$volume/elan"
            echo "XDG_CACHE_HOME=$volume/cache"
            echo "TMPDIR=$volume/tmp"
          } >> "$GITHUB_ENV"
          echo "$volume/elan/bin" >> "$GITHUB_PATH"
          df -h "$volume"

      - name: Select Python for the upstream cache client
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Check out the candidate and its upstream base
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: RossRichardson/riemann-hypothesis
          ref: 4d8a3b4cb4b653268eac38bdb35959710ce5cc37
          path: build-volume/repo
          fetch-depth: 3
          persist-credentials: false

      - name: Verify candidate identity and restore the base checkout
        working-directory: build-volume/repo
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(git rev-parse HEAD^)" = "$BASE_SHA"
          directory=src/Development/AutomorphicArithmetic/AutomorphicVarieties/PadicHodgeTheory
          diff -u <(printf '%s\n' "$directory/LaConv.lean" "$directory/WeightZeroPeriodMatrices.lean" "$directory/WtMatFix.lean") \
                  <(git diff --name-only --no-renames "$BASE_SHA" "$CANDIDATE_SHA")
          git switch --detach "$BASE_SHA"
          test "$(git rev-parse HEAD:src)" = 00c2fd41c7b96184317b81cef9e3ffdc730e99c6
          test "$(cat lean-toolchain)" = leanprover/lean4:v4.37.0-rc1

      - name: Install the repository's pinned Lean toolchain
        working-directory: build-volume/repo
        shell: bash
        run: |
          set -euo pipefail
          file="$RUNNER_TEMP/elan.tar.gz"
          curl --fail --location --silent --show-error --retry 3 \
            https://github.com/leanprover/elan/releases/download/v4.4.0/elan-x86_64-unknown-linux-gnu.tar.gz -o "$file"
          echo "0e8250aa2be86c7af929ade68db617af9edc8b9ccf6eaf5ece228250d0d032e2  $file" | sha256sum --check
          tar xzf "$file" -C "$RUNNER_TEMP" elan-init
          "$RUNNER_TEMP/elan-init" -y --default-toolchain none --no-modify-path
          elan toolchain install "$(cat lean-toolchain)"
          lean --version
          lake --version

      - name: Restore and check the complete upstream build
        working-directory: build-volume/repo
        shell: bash
        run: |
          set -euo pipefail
          ulimit -Sn 65536
          /usr/bin/time -v lake exe cache get
          /usr/bin/time -v lake build --no-build
          df -h .
          du -sh .lake/build .lake/packages .lake/cache "$ELAN_HOME"

      - name: Build every default target on the exact PR commit
        working-directory: build-volume/repo
        shell: bash
        run: |
          set -euo pipefail
          ulimit -Sn 65536
          git switch --detach "$CANDIDATE_SHA"
          git diff --exit-code HEAD --
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          /usr/bin/time -v lake build
          /usr/bin/time -v lake build --no-build

      - name: Record final resource usage
        if: always()
        shell: bash
        run: |
          free -h
          swapon --show
          df -h "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/build-volume"
